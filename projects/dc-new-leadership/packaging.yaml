chapters:
  HOOK: "DC's leadership change"
  SEGMENT 1: "Please don't reboot"
  SEGMENT 2: "Keep the world Gunn built"
  SEGMENT 3: "Big movies + the animated blueprint"
  SEGMENT 4: "The trust bank"
  SEGMENT 5: "Lanterns and Hal Jordan"
