description:
  hook: |
    James Gunn and Peter Safran are leaving DC Studios, and Jeremy Latcham takes over the new leadership on December 1.
    Here's what I want DC to keep, what has to change, and why another reboot would be the worst move.
  summary: |
    My honest take as a DC fan on the DC Studios leadership change. No reboot: keep the Superman movie, Lanterns and Creature Commandos lore. Then the priority should be the big ones (Batman, Wonder Woman, Justice League), using the original DC animated movies as the blueprint. And why I think James Gunn, in the best way possible, jumped the gun on the side projects before DC earned our trust the way Marvel did after Endgame.

    Note: Gunn is stepping down as co-chair but is still directing Man of Tomorrow.
  extra: |
    Next up: my thoughts on Robert Pattinson as James Bond AND Batman. Let me know if you want it.
    What should DC's new boss do first? Tell me in the comments.

