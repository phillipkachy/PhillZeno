# Shorts for video #3. Picked with the yt-shorts rules: opens on a complete thought, has a turn, ends on a line.
# Phill's original voice; the new hook is shown as on-screen text (first_2s_text) + first line of the description.
shorts:
  - from: "I don't want them to reboot the universe."
    to: "I don't think that movie captured Superman."
    banner: "Don't reboot DC again"
    first_2s_text: "NO MORE REBOOTS"
    hook: "DC just changed bosses again, and if they reboot the universe one more time, that's a horrible sign."
    title: "DC Cannot Reboot the DCU Again"
    description: "James Gunn is out at DC Studios. Here's why another reboot would be the worst move. Full video on my channel."
  - from: "And my hope has always been to kind of follow a guideline"
    to: "a good connected universe."
    banner: "DC already has the blueprint"
    first_2s_text: "THE BLUEPRINT"
    hook: "DC already made the perfect blueprint for a connected universe. It's the animated movies."
    title: "DC's Blueprint Is the Animated Movies"
    description: "The original DC animated movies stayed true to the comics for ten years. That's what the new DC should follow. Full video on my channel."
  - from: "It's like a trust bank."
    to: "because you earned it."
    banner: "DC's trust problem"
    first_2s_text: "TRUST BANK"
    hook: "Marvel earned our trust for ten years. That's why we watched Moon Knight. DC skipped that step."
    title: "Why We Trusted Marvel and Not DC"
    description: "The trust bank: why Marvel's side projects worked after Endgame, and DC's didn't. Full video on my channel."
  - from: "And I think James Gunn jumped the gun a little bit"
    to: "a very bold choice to do Lanterns when they did it."
    banner: "Bring back Hal Jordan"
    first_2s_text: "HAL JORDAN NEXT"
    hook: "James Gunn jumped the gun, no pun intended. Lanterns should have been a movie."
    title: "Lanterns Should Have Been a Movie"
    description: "Hal Jordan in his prime, Green Lantern: Rebirth, Parallax. Here's what I want from DC's Lanterns. Full video on my channel."
