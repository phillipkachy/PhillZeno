# Shorts for "The Comic That Explains Avengers: Doomsday". Picked by Claude; edit freely.
# from = first words of the opening line, to = last words of the closing line (copied from script.md).
# banner = big text pinned at the top of the Short (3-5 words).

shorts:
  - from: "In Hickman's comics, the multiverse starts dying."
    to: "so yours can keep going."
    banner: "What is an Incursion?"
    title: "The Threat Behind Avengers: Doomsday, Explained"
    description: |
      In the comics, two universes collide and there's only one way to survive: destroy the other Earth.
      Here's what an Incursion is, and why it matters for Avengers: Doomsday. Full breakdown on my channel.

  - from: "Now Captain America was in the room early on."
    to: "Because they knew he'd stop them."
    banner: "They mind-wiped Cap"
    title: "The Avengers Erased Captain America's Memory"
    description: |
      Marvel's smartest heroes wiped Steve Rogers' mind because they knew he'd stop them.
      From Hickman's New Avengers, the story Avengers: Doomsday is pulling from. Full video on my channel.

  - from: "Meanwhile, the multiverse keeps collapsing."
    to: "And he takes their power for himself."
    banner: "Doom killed gods"
    title: "How Doctor Doom Killed the Beyonders"
    description: |
      The Beyonders were killing the multiverse. Doctor Doom killed them and took their power.
      This is how God Emperor Doom was born (Time Runs Out / Secret Wars). Full video on my channel.

  - from: "Doom rules it all as God Emperor."
    to: "They're living lives Doom handed them."
    banner: "God Emperor Doom"
    title: "Doctor Doom Stole Reed Richards' Family"
    description: |
      In Secret Wars, Doom rules Battleworld, married to Sue Storm and raising Reed's kids as his own.
      And nobody remembers. Full breakdown of the comic behind Avengers: Doomsday on my channel.

  - from: "The final battle of Secret Wars is Reed Richards versus Victor von Doom."
    to: "That's Reed Richards."
    banner: "How Secret Wars ends"
    title: "How Reed Richards Beat God Emperor Doom"
    description: |
      Spoilers for Secret Wars (2015): the ending isn't a punch, it's a question.
      Full video on the comic behind Avengers: Doomsday on my channel.
