    pairs_with: "The 2015 Comic That Explains Avengers: Doomsday"
    image: "God Emperor Doom on his throne (Secret Wars 2015 art) on the left 60%, dark background, text stacked on the right."
    notes: "Bright yellow or white text with a thick black outline. Doom's green and gold pop on dark red or black. Keep his face/mask big: it has to read at phone size."
